[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-privacy-filter"
version = "0.2.7rc2"
description = "Local video text masking with EasyOCR and OpenAI Privacy Filter"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
  "easyocr==1.7.2",
  "av>=16,<19",
  "imageio-ffmpeg>=0.6,<0.9",
  "Pillow>=11,<14",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "wheel>=0.45,<1"]

[project.scripts]
vpf = "video_privacy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_privacy = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
